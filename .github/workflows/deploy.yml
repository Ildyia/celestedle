name: Deploy Celestedle API

on:
  push:
    branches:
      - main
      - betatest

# Annule les déploiements précédents sur la même branche/environnement
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-prod:
    if: github.ref_name == 'main'
    runs-on: [self-hosted, linux]
    environment: celestedleEnv
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker installation
        run: command -v docker

      - name: Setup .env file
        run: |
          echo "PORT=${{ secrets.PORT }}" > .env
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
          echo "API_URL=https://celestedle-api.mizkyosia.fr/" >> .env
          echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}" >> .env
          echo "DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}" >> .env
          echo "RANDOM_SEED=${{ secrets.RANDOM_SEED }}" >> .env
          echo "JWT_SECRET=${{secrets.JWT_SECRET}}">>.env

      - name: Deploy Production
        run: docker compose up -d --build --force-recreate

  deploy-staging:
    if: github.ref_name == 'beta'
    runs-on: ubuntu-latest
    environment: celestedleEnv
    steps:
      - name: Trigger Render Deployment
        run: curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK }}"
