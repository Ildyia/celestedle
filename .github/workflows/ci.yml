name: CI

# Lint et tests sur la bêta et les pull requests. Le déploiement de prod
# reste dans deploy.yml (branche main uniquement).
on:
  push:
    branches:
      - beta
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
