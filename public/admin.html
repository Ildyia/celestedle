<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Admin</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/theme-celeste.css" />
  </head>
  <body class="theme-celeste">
    <div class="admin-container">
      <h1>Panneau d'administration</h1>

      <section class="admin-section">
        <h2>Actions rapides</h2>
        <div class="admin-actions">
          <button class="admin-btn" id="btn-get-secret">
            Voir le mot secret
          </button>
          <button class="admin-btn" id="btn-random-secret">
            Changer le mot secret
          </button>
          <button class="admin-btn admin-btn-danger" id="btn-force-reset">
            Réinitialiser le jeu (Reset)
          </button>
        </div>
      </section>
    </div>

    <script type="module">
      import { initAdminTools } from "./js/admin-tools.js";

      document.addEventListener("DOMContentLoaded", () => {
        initAdminTools();

        document
          .getElementById("btn-get-secret")
          ?.addEventListener("click", () => {
            window.getSecretWordPlzUwU();
          });

        document
          .getElementById("btn-random-secret")
          ?.addEventListener("click", () => {
            window.randomSecret();
          });

        document
          .getElementById("btn-force-reset")
          ?.addEventListener("click", () => {
            window.triggerReset();
          });
      });
    </script>
  </body>
</html>
