<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Éditeur d'entités — Celestedle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Éditeur d'entités (assigner une image locale)</h1>
    <div id="editor">
      <div id="left">
        <button id="prev">◀ Précédent</button>
        <button id="next">Suivant ▶</button>
        <h2 id="entity-name"></h2>
        <img id="current-img" class="review-thumb" src="" alt="current" />
        <div>
          <button id="assign-btn">Assigner l'image sélectionnée</button>
          <span id="assign-status"></span>
        </div>
      </div>

      <div id="right">
        <label for="local-file">Choisir une image depuis l'ordinateur</label>
        <input id="local-file" type="file" accept="image/*" />
        <div id="preview-container" style="margin-top:16px;">
          <img id="preview-img" style="max-width:100%;max-height:70vh;object-fit:contain;border:1px solid #ccc;display:none;" alt="Aperçu de l'image sélectionnée" />
        </div>
      </div>
    </div>
  </main>

  <script src="js/entity-editor.js"></script>
</body>
</html>
