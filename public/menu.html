<!doctype html>
<html lang="en" class="ui-modern">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celestedle</title>
    <!-- style.css + modern.css : pour les fenêtres de la page de jeu
         (profil, classements, bug) ouvertes dans le menu -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="celeste-ui.css" />
    <link rel="stylesheet" href="menu.css" />
    <link rel="stylesheet" href="modern.css" />
    <!-- Ciel selon l'heure, posé avant l'affichage (voir js/sky.js) -->
    <script>
      try {
        var on = localStorage.getItem("celestedle_time_sky") !== "false", h = new Date().getHours();
        document.documentElement.dataset.sky = !on || h >= 21 || h < 5 ? "night" : h < 8 ? "dawn" : h < 17 ? "day" : "dusk";
      } catch {}
    </script>
    <link rel="icon" href="assets/berrywinged.png" type="image/png" />
  </head>
  <!-- Page d'accueil façon menus de Celeste (voir REDESIGN.md).
       Page de travail : elle deviendra index.html une fois terminée. -->
  <body data-screen="title" data-game="celestedle">
    <div id="scene" aria-hidden="true">
      <div id="stars"></div>
      <div id="moon">
        <span class="moon-glow"><span></span></span>
        <span class="moon-body"></span>
        <span class="moon-star" style="--x: 39%; --y: -13%; --s: 15px; --c: #ffb3e6; --d: 0.00s">✦</span>
        <span class="moon-star" style="--x: 69%; --y: -17%; --s: 10px; --c: #8fe3ff; --d: 0.17s">✦</span>
        <span class="moon-star" style="--x: 92%; --y: 2%; --s: 12px; --c: #c9a8ff; --d: 0.34s">✦</span>
        <span class="moon-star" style="--x: 115%; --y: 23%; --s: 15px; --c: #ffb3e6; --d: 0.51s">✦</span>
        <span class="moon-star" style="--x: 114%; --y: 53%; --s: 10px; --c: #8fe3ff; --d: 0.68s">✦</span>
        <span class="moon-star" style="--x: 111%; --y: 83%; --s: 12px; --c: #c9a8ff; --d: 0.85s">✦</span>
        <span class="moon-star" style="--x: 87%; --y: 102%; --s: 15px; --c: #ffb3e6; --d: 1.02s">✦</span>
        <span class="moon-star" style="--x: 62%; --y: 119%; --s: 10px; --c: #8fe3ff; --d: 1.19s">✦</span>
        <span class="moon-star" style="--x: 33%; --y: 112%; --s: 12px; --c: #c9a8ff; --d: 1.36s">✦</span>
        <span class="moon-star" style="--x: 4%; --y: 102%; --s: 15px; --c: #ffb3e6; --d: 1.53s">✦</span>
        <span class="moon-star" style="--x: -9%; --y: 75%; --s: 10px; --c: #8fe3ff; --d: 1.70s">✦</span>
        <span class="moon-star" style="--x: -20%; --y: 47%; --s: 12px; --c: #c9a8ff; --d: 1.87s">✦</span>
        <span class="moon-star" style="--x: -6%; --y: 19%; --s: 15px; --c: #ffb3e6; --d: 2.04s">✦</span>
        <span class="moon-star" style="--x: 9%; --y: -7%; --s: 10px; --c: #8fe3ff; --d: 2.21s">✦</span>
      </div>
      <!-- Montagne : une image PNG fixe (Firefox redessine les images SVG à
           chaque étape d'un zoom, pas les PNG) et le drapeau animé dans son
           propre calque. Source modifiable : assets/menu/mountain.svg.
           Coordonnées du drapeau = celles du dessin (viewBox 1600 × 700). -->
      <div id="mountain">
        <div class="mountain-art">
          <img src="assets/menu/mountain.png" alt="" draggable="false" decoding="async" />
          <svg id="summit-flag" viewBox="896 164 58 92">
            <line x1="900" y1="252" x2="900" y2="168" stroke="#16142f" stroke-width="4" stroke-linecap="round" />
            <rect class="cloth" x="902" y="170" width="46" height="28" />
          </svg>
        </div>
      </div>
      <div id="dim"></div>
    </div>

    <!-- Titre -->
    <section id="title" class="screen">
      <h1 class="outlined">CELESTEDLE</h1>
      <p class="tagline outlined">A daily Celeste guessing game</p>
      <span class="ver outlined" id="version"></span>
    </section>

    <!-- Sélection de fichier = profil -->
    <section id="files" class="screen">
      <h2 class="outlined">Select a file</h2>
      <div class="slots" id="slots"></div>
      <ul class="menu file-actions outlined" id="file-actions"></ul>
    </section>

    <!-- Sélection des modes = sélection de chapitre -->
    <section id="modes" class="screen">
      <div class="icons" id="icons"></div>
      <div class="mode-label outlined" id="mode-label"></div>
      <div class="book">
        <div class="tabs" id="tabs">
          <button type="button" class="tab a" data-side="a">A-Side · Normal</button>
          <button type="button" class="tab b" data-side="b">B-Side · Hard</button>
        </div>
        <div class="chapter" id="book-chapter"></div>
        <h3 id="book-title"></h3>
        <p class="desc" id="book-desc"></p>
        <p class="today" id="book-today"></p>
        <p class="next">Next climb in <span id="book-next-time"></span></p>
        <div class="record" id="book-record"></div>
        <button type="button" class="climb a" id="climb">Climb</button>
      </div>
      <div class="corner">
        <button type="button" id="to-journal"><img src="assets/illustration/journal.png" alt="" />Journal</button>
        <button type="button" id="to-options"><img src="assets/illustration/options.png" alt="" />Options</button>
        <button type="button" id="to-report"><img src="assets/illustration/wtf.png" alt="" />Report a bug</button>
      </div>
    </section>

    <!-- Options -->
    <section id="options" class="screen">
      <h2 class="outlined">OPTIONS</h2>
      <ul class="menu outlined" id="menu"></ul>
    </section>

    <!-- Journal : un carnet à feuilleter, comme le journal du jeu (js/journal.js) -->
    <div id="journal" class="journal-wrap" hidden>
      <div class="journal" role="dialog" aria-modal="true" aria-label="Journal">
        <nav class="journal-tabs" id="journal-tabs" aria-label="Journal pages"></nav>
        <button type="button" class="journal-close" id="journal-close" aria-label="Close">✕</button>
        <div class="journal-page" id="journal-page"></div>
        <div class="journal-foot">
          <button type="button" id="journal-prev" aria-label="Previous page">◂</button>
          <span id="journal-count"></span>
          <button type="button" id="journal-next" aria-label="Next page">▸</button>
        </div>
      </div>
    </div>

    <div class="hints outlined" id="hints"></div>

    <script type="module" src="js/menu.js"></script>
  </body>
</html>
